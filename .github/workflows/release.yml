name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      - name: Package
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p release
          cp dist/index.js "release/bettermail-${TAG}.js"

      - name: Tag message
        id: tag
        run: |
          # Annotated tag (-a/-m) subject+body; lightweight tag → empty
          MSG=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed -e 's/[[:space:]]*$//')
          {
            echo "message<<EOF"
            echo "$MSG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Bettermail ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ${{ steps.tag.outputs.message }}

            ## 部署

            1. 下载 `bettermail-${{ github.ref_name }}.js` 去Cloudflare中创建worker粘贴。
            2. 绑定存储二选一：
              - D1 名称为 `DB`
              - KV 名称为 `BMAIL`
            3. （可选）配置环境变量：`API_TOKEN`
            4. （可选）`ALLOW_LIST_ALL=1` 时允许不传 to 拉全部收件箱的邮件；默认禁止
            5. 在你的域名下的 Email Routing 设置 Catch-all → 该 Worker

          files: |
            release/bettermail-${{ github.ref_name }}.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
