name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      - name: Package
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p release
          cp dist/index.js "release/bettermail-${TAG}.js"

      - name: Tag message
        id: tag
        run: |
          # Annotated tag (-a/-m) subject+body; lightweight tag → empty
          MSG=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed -e 's/[[:space:]]*$//')
          {
            echo "message<<EOF"
            echo "$MSG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Bettermail ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ${{ steps.tag.outputs.message }}

            ## 部署

            1. 下载 `bettermail-${{ github.ref_name }}.js`
            2. Cloudflare → Workers → Create Worker → Edit code
            3. 粘贴 JS → Save and Deploy
            4. Bindings → KV：`BMAIL`
             5. （可选）Secret：`API_TOKEN`
             6. （可选）`ALLOW_LIST_ALL=1` 才允许不传 to 拉全部；默认禁止
             7. Email Routing Catch-all → 该 Worker

          files: |
            release/bettermail-${{ github.ref_name }}.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
