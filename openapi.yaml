openapi: 3.0.3
info:
  title: Bettermail
  version: 1.1.0
  description: |
    Catch-all 邮件入库 KV，GET/POST /mails 消费（返回即删）。
    默认必须传 to/email/mailbox；仅当 Worker 环境变量 ALLOW_LIST_ALL=1/true/yes 时允许省略以拉取全部。
    GET / 返回内置 Web UI；GET /config 返回前端所需的公开配置（是否需要密码、是否允许全收）。

servers:
  - url: https://bettermail.example.workers.dev
  - url: http://127.0.0.1:8787

paths:
  /:
    get:
      summary: Web UI
      operationId: getWebUi
      description: 返回内置单页 HTML（Claude 风格邮件加载界面）。无需鉴权。
      security: []
      responses:
        "200":
          description: HTML 页面
          content:
            text/html:
              schema:
                type: string

  /config:
    get:
      summary: 公开配置
      operationId: getConfig
      description: |
        供前端探测是否需要密码（API_TOKEN 已设置）、是否允许不填邮箱拉全量（ALLOW_LIST_ALL）。
        不返回任何密钥本身。无需鉴权。
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigResponse"
              example:
                code: 0
                message: ok
                data:
                  needsAuth: true
                  allowListAll: false

  /mails:
    get:
      summary: 消费邮件
      operationId: consumeMailsGet
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/to"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/token"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailsResponse"
        "400":
          description: mailbox required（未传 to 且未开启 ALLOW_LIST_ALL）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: unauthorized（已设置 API_TOKEN 且鉴权失败）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: 消费邮件
      operationId: consumeMailsPost
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/token"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailsRequest"
            example:
              to: user@example.com
              limit: 20
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/MailsRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailsResponse"
        "400":
          description: mailbox required（未传 to 且未开启 ALLOW_LIST_ALL）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: unauthorized（已设置 API_TOKEN 且鉴权失败）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Authorization: Bearer <API_TOKEN>；仅当环境变量 API_TOKEN 已设置时需要
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 等同 Bearer；仅当环境变量 API_TOKEN 已设置时需要

  parameters:
    to:
      name: to
      in: query
      required: false
      description: |
        收件邮箱。默认必填；仅当 Worker 设置 ALLOW_LIST_ALL=1/true/yes 时可不传（拉全部）。
        别名 query：email、mailbox。
      schema:
        type: string
        format: email
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    token:
      name: token
      in: query
      required: false
      description: 等同 Bearer / X-API-Key（可选）
      schema:
        type: string

  schemas:
    MailsRequest:
      type: object
      properties:
        to:
          type: string
          format: email
          description: 默认必填；ALLOW_LIST_ALL 开启时可省略
        email:
          type: string
          format: email
          description: to 别名
        mailbox:
          type: string
          format: email
          description: to 别名
        limit:
          type: integer
          minimum: 1
          maximum: 100

    ApiEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: ok
        data:
          nullable: true

    ConfigResponse:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ConfigData"

    ConfigData:
      type: object
      required: [needsAuth, allowListAll]
      properties:
        needsAuth:
          type: boolean
          description: true 表示已设置 API_TOKEN，调用 /mails 需要鉴权
        allowListAll:
          type: boolean
          description: true 表示允许省略 to 拉取全部邮箱

    MailsResponse:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/MailsData"

    ErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          properties:
            data:
              nullable: true
              example: null

    MailsData:
      type: object
      required: [list, to, hasMore]
      properties:
        list:
          type: array
          items:
            $ref: "#/components/schemas/Email"
        to:
          type: string
          nullable: true
        hasMore:
          type: boolean

    Email:
      type: object
      properties:
        id:
          type: string
        receivedAt:
          type: string
          format: date-time
        from:
          type: string
        to:
          type: string
        subject:
          type: string
        messageId:
          type: string
          nullable: true
        date:
          type: string
          nullable: true
        text:
          type: string
          nullable: true
        html:
          type: string
          nullable: true
        headers:
          type: object
          additionalProperties:
            type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
        rawBase64:
          type: string
        rawSize:
          type: integer

    Attachment:
      type: object
      properties:
        filename:
          type: string
          nullable: true
        mimeType:
          type: string
        size:
          type: integer
        contentId:
          type: string
          nullable: true
        contentBase64:
          type: string
